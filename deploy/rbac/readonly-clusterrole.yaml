# Read-only access for `k8s-doctor --cluster`.
#
# Only the verbs the collector uses, on exactly the resources it reads
# (internal/collector/cluster.go RequiredResources; a test keeps the two in
# sync): get and list on namespaces, list on everything else. No watch, and
# no get on Secrets, so Secrets cannot be fetched by name. Secrets and
# ConfigMaps are listed through the metadata API, which never sends values,
# but list on secrets would still let this identity read values with another
# client, so bind it only to k8s-doctor. To avoid that grant, drop the
# secrets entry and run with --skip-secrets. For one namespace, use
# readonly-role-namespaced.yaml instead.
#
#   kubectl apply -f deploy/rbac/readonly-clusterrole.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-doctor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-doctor
  namespace: k8s-doctor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-doctor-readonly
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, services, events, configmaps, secrets]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-doctor-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-doctor-readonly
subjects:
  - kind: ServiceAccount
    name: k8s-doctor
    namespace: k8s-doctor
